[project]
name = "power-equipment-rag-workspace"
version = "0.1.0"
description = "Workspace for the power-equipment RAG console, prototype pipelines, and archived experiments."
authors = [{ name = "Power Equipment RAG Team" }]
keywords = ["rag", "chromadb", "knowledge-base", "power-equipment"]
requires-python = ">=3.11,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "chromadb>=0.5.23",
    "fastapi>=0.135.3",
    "igraph>=0.11.4",
    "jieba>=0.42.1",
    "jsonschema>=4.23,<5",
    "leidenalg>=0.10.2",
    "networkx>=3.0",
    "numpy>=2.3.4",
    "orjson>=3.11.8",
    "pydantic>=2.13.0",
    "pypdf>=6.10.1",
    "PyYAML>=6.0,<7",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "rank-bm25>=0.2.2",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=4.46.3",
    "uvicorn>=0.44.0",
]

[project.urls]
Homepage = "https://github.com/JavonLoong/RAG"
Repository = "https://github.com/JavonLoong/RAG"
Documentation = "https://github.com/JavonLoong/RAG"

[project.scripts]
power-rag-prototype = "power_rag_pipeline.pipeline:main"

[dependency-groups]
dev = [
    "deptry>=0.23.0",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "mypy>=0.991",
    "pre-commit>=2.20.0",
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.5",
    "tox-uv>=1.11.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "data_pipeline/prototype/power_rag_pipeline",
  "knowledge_base",
  "workflow_runtime",
]

[tool.mypy]
files = [
  "data_pipeline/prototype",
  "core_domain/query_contracts.py",
  "api_server/current_console/chroma_rag_poc/src/chroma_rag_poc/query_service.py",
  "api_server/current_console/chroma_rag_poc/src/chroma_rag_poc/routes_query_v1.py",
  "scripts/query_skill.py",
  "core_domain/structured_output",
  "structured_output_application",
  "structured_output_infrastructure",
  "core_domain/structured_generation",
  "structured_generation_application",
  "structured_generation_infrastructure",
  "fmea_application",
  "fmea_infrastructure",
  "api_server/current_console/chroma_rag_poc/src/chroma_rag_poc/api.py",
  "api_server/current_console/chroma_rag_poc/src/chroma_rag_poc/fmea_review_contracts.py",
  "api_server/current_console/chroma_rag_poc/src/chroma_rag_poc/routes_fmea_review_v1.py",
  "api_server/current_console/chroma_rag_poc/src/chroma_rag_poc/workspace_registry.py",
  "fmea_application/structured_candidate_adapter.py",
  "fmea_infrastructure/profile_loader.py",
  "scripts/output_template_skill.py",
  "scripts/structured_generation_skill.py",
  "scripts/fmea_skill.py",
  "scripts/run_fmea_review_acceptance.py",
  "scripts/verify_fmea_review_acceptance.py",
  "knowledge_base",
  "workflow_runtime",
  "retrieval_engine/knowledge_base.py",
  "scripts/knowledge_base_cli.py",
  "tests",
]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/regression", "tests/performance"]
python_files = ["test_*.py"]
addopts = "-m 'not live_deepseek'"
markers = [
  "live_deepseek: explicit paid DeepSeek API smoke test",
]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT",
    "S",
    "B",
    "A",
    "C4",
    "T10",
    "SIM",
    "I",
    "C90",
    "E",
    "W",
    "F",
    "PGH",
    "UP",
    "RUF",
    "TRY",
]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"knowledge_base/adapters.py" = ["TRY003"]
"knowledge_base/chunking.py" = ["RUF001", "TRY003"]
"knowledge_base/contracts.py" = ["TRY003"]
"knowledge_base/query.py" = ["RUF001", "TRY003"]
"knowledge_base/store.py" = ["TRY003"]
"workflow_runtime/engine.py" = ["TRY003", "TRY300", "TRY301"]
"scripts/knowledge_base_cli.py" = ["TRY003"]
"tests/unit/test_knowledge_base_lifecycle.py" = ["RUF001"]
"tests/unit/test_workflow_runtime.py" = ["TRY003"]
"tests/integration/test_m3_m6_knowledge_pipeline.py" = ["RUF001"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["power_rag_pipeline", "knowledge_base", "workflow_runtime"]
