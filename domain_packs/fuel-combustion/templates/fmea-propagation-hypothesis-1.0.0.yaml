template:
  id: fmea-propagation-hypothesis
  version: 1.0.0
  title: Bounded FMEA propagation hypothesis
  description: Propose topology-bounded propagation edges only; deterministic code and human review own acceptance.
  domain_tags: [fmea, propagation, proposal]
  schema_dialect: https://json-schema.org/draft/2020-12/schema
output_schema:
  type: object
  additionalProperties: false
  required: [edges]
  properties:
    edges:
      type: array
      maxItems: 40
      items:
        type: object
        additionalProperties: false
        required:
          - barrier_ids
          - claim_status
          - delay_ms
          - direction
          - evidence_ids
          - evidence_support
          - fault_tolerance_time_ms
          - interface_id
          - interface_variable
          - is_cyclic
          - is_external
          - is_terminal
          - is_unprocessed
          - operating_modes
          - path_length
          - relation_type
          - response_time_ms
          - risk_priority
          - source_entity_id
          - target_entity_id
          - threshold
          - unit
        properties:
          interface_id: {type: string, minLength: 1, maxLength: 256}
          source_entity_id: {type: string, minLength: 1, maxLength: 256}
          target_entity_id: {type: string, minLength: 1, maxLength: 256}
          relation_type: {type: string, minLength: 1, maxLength: 64}
          interface_variable: {type: string, minLength: 1, maxLength: 128}
          unit: {type: string, minLength: 1, maxLength: 64}
          direction: {type: string, minLength: 1, maxLength: 128}
          threshold: {type: [string, 'null'], maxLength: 256}
          operating_modes:
            type: array
            minItems: 1
            maxItems: 32
            uniqueItems: true
            items: {type: string, minLength: 1, maxLength: 128}
          delay_ms: {type: [integer, 'null'], minimum: 0}
          response_time_ms: {type: [integer, 'null'], minimum: 0}
          fault_tolerance_time_ms: {type: [integer, 'null'], minimum: 0}
          barrier_ids:
            type: array
            maxItems: 64
            uniqueItems: true
            items: {type: string, minLength: 1, maxLength: 256}
          evidence_ids:
            type: array
            minItems: 1
            maxItems: 32
            uniqueItems: true
            items: {type: string, minLength: 1, maxLength: 128}
          evidence_support:
            type: string
            enum: [supported, partially_supported, contradicted, not_supported]
          claim_status:
            type: string
            enum: [known, unknown, insufficient_evidence, conflict, not_applicable]
          path_length: {type: integer, minimum: 1, maximum: 2}
          is_cyclic: {type: boolean}
          is_unprocessed: {type: boolean}
          is_external: {type: boolean}
          is_terminal: {type: boolean}
          risk_priority: {type: [string, 'null'], maxLength: 64}
evidence_bindings: []
